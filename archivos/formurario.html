<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../estilo/style.css">
    <title>Formurario</title>
</head>

<body>
    <header>
        <h1>Formulario UTU 2026</h1>
    </header>
    <nav>
        <button class="btnFormurario" onclick="window.location.href='../index.html'"><b>VOLVER</b></button>
    </nav>

    <div class="contenedor">
        <main>
            <article>
                <form id="formulario">
                    <label for="nombre">Nombre </label><br>
                    <input type="text" id="nombre" name="nombre" placeholder="escriba el nombre aqui"><br>
                    <label for="apellido">Apellido</label><br>
                    <input type="text" id="apellido" name="apellido"><br>
                    <label for="email">Email </label><br>
                    <input type="email" id="email" name="email"><br>
                    <label for="password">Contraseña</label><br>
                    <input type="password" id="password" name="password"><br>
                    <label for="fecha">Fecha de nacimiento</label><br>
                    <input type="date" id="fecha" name="fecha"><br>
                    <label for="edad">Edad</label><br>
                    <input type="number" id="edad" name="edad"><br>
                    <input type="submit" value="Enviar">
                </form>

            </article>
        </main>
        <aside>
            <img src="../recursos/loop.gif" alt="Publicidad">
        </aside>
    </div>

    <footer>
        <h1>Pie de pagina</h1>
        <p>Copyright &copy; 2026</p>
        <a href="https://www.google.com">Google</a>
    </footer>


</body>

</html>
